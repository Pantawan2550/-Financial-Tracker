<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Tracker</title>

    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
    <h1>💰 Financial Tracker</h1>
    <p>จัดการการเงินของคุณได้ง่ายมากยิ่งขึ้น</p>
</header>

<main class="container">

    <!-- Dashboard -->
    <section class="dashboard">

        <div class="card">
            <h3>ยอดคงเหลือ</h3>
            <h2 id="balance">0 บาท</h2>
        </div>

        <div class="card">
            <h3>รายรับ</h3>
            <h2 id="income">0 บาท</h2>
        </div>

        <div class="card">
            <h3>รายจ่าย</h3>
            <h2 id="expense">0 บาท</h2>
        </div>

    </section>

    <!-- เพิ่มรายการ -->
    <section class="form-box">

        <h2>เพิ่มรายการรายรับ-รายจ่าย</h2>

        <form id="transactionForm">

            <label>ประเภท</label>
            <select id="type">
                <option value="income">รายรับ</option>
                <option value="expense">รายจ่าย</option>
            </select>

            <label>หมวดหมู่</label>
            <input type="text" id="category" placeholder="เช่น อาหาร">

            <label>จำนวนเงิน</label>
            <input type="number" id="amount">

            <label>วันที่</label>
            <input type="date" id="date">

            <label>รายละเอียด</label>
            <textarea id="detail"></textarea>

            <button type="submit">
                บันทึกข้อมูล
            </button>

        </form>

    </section>

    <!-- ค้นหา -->
    <section>

        <h2>ค้นหารายการ</h2>

        <input
        type="text"
        id="search"
        placeholder="ค้นหาหมวดหมู่ หรือรายละเอียด">

    </section>

    <!-- ตาราง -->
    <section>

        <h2>ประวัติรายการ</h2>

        <table>

            <thead>

                <tr>

                    <th>วันที่</th>
                    <th>ประเภท</th>
                    <th>หมวดหมู่</th>
                    <th>จำนวนเงิน</th>
                    <th>รายละเอียด</th>
                    <th>จัดการ</th>

                </tr>

            </thead>

            <tbody id="transactionTable">

            </tbody>

        </table>

    </section>

    <!-- กราฟ -->
    <section>

        <h2>สรุปรายรับ-รายจ่าย</h2>

        <canvas id="myChart"></canvas>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
